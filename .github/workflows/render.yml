name: Render video
on: workflow_dispatch
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libasound2 libxrandr2 libxkbcommon-x11-0 libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 libgbm1
      - run: npm install
      - run: npx remotion render src/index.ts Short out/short.mp4
      - name: Save video to repo
        run: |
          mkdir -p video
          cp out/short.mp4 video/short.mp4
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add video/short.mp4
          git commit -m "Add rendered video"
          git push
